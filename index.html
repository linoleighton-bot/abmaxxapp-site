<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AbMaxx</title>
<meta name="description" content="AbMaxx: Become Shredded. Snap a photo, let AI analyze your abs, and get a routine built for you. Free on the App Store and Google Play.">
<link rel="canonical" href="https://abmaxxapp.com/">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-itunes-app" content="app-id=6757769125">
<link rel="icon" href="/logo.png" sizes="any">
<link rel="apple-touch-icon" href="/logo.png">
<meta property="og:title" content="AbMaxx">
<meta property="og:description" content="Download AbMaxx on the App Store or Google Play.">
<meta property="og:url" content="https://abmaxxapp.com/">
<meta property="og:image" content="https://abmaxxapp.com/og.png">
<meta property="og:type" content="website">
<style>
  :root { --bg: #000000; --fg: #ffffff; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding-block: 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; }
  h1 { margin-top: 6px; font-size: clamp(38px, 7vw, 52px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; color: var(--fg); }
  .tagline { margin-top: 6px; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #ffffff; }
  .sub { margin-top: 14px; max-width: 400px; font-size: 16px; line-height: 1.6; color: #ffffff; }
  .logo { width: 170px; height: 170px; max-width: 48vw; display: block; }
  .stores { margin-top: 32px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .badge { display: inline-block; height: 56px; border-radius: 8px; transition: transform .15s ease, opacity .15s ease; }
  .badge img, .badge svg { height: 56px; width: auto; display: block; }
  .badge:hover { transform: translateY(-2px); opacity: .9; }
  .badge:focus-visible { outline: 3px solid #2f6bff; outline-offset: 3px; }
  .note { margin-top: 18px; font-size: 13px; color: #ffffff; opacity: .8; }
  .note a { color: #fff; }
  /* In-app browser callout (Instagram, Facebook, TikTok, etc.) */
  .iab {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; z-index: 20;
    display: none; align-items: flex-start; gap: 12px;
    background: #0f1420; border: 1px solid #2f6bff; border-radius: 14px; padding: 12px 14px;
    color: #fff; font-size: 14px; line-height: 1.4; box-shadow: 0 12px 30px rgba(0,0,0,.6);
  }
  .iab.show { display: flex; }
  .iab .arrow { flex-shrink: 0; width: 28px; height: 28px; color: #2f6bff; animation: nudge 1.2s ease-in-out infinite; }
  .iab .arrow svg { width: 28px; height: 28px; }
  .iab b { display: block; font-weight: 600; margin-bottom: 2px; }
  .iab .steps { color: #c9cdd6; }
  .iab .steps kbd { font: inherit; font-weight: 700; color: #fff; }
  .iab .close { margin-left: auto; flex-shrink: 0; background: none; border: 0; color: #8a90a0; font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px; }
  @keyframes nudge { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(4px, -4px); } }
  @media (prefers-reduced-motion: reduce) { .iab .arrow { animation: none; } }
  @media (prefers-reduced-motion: reduce) { .badge { transition: none; } }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="" width="170" height="170">
    <h1>AbMaxx</h1>
    <p class="tagline">Become Shredded</p>
    <p class="sub">AI-powered abs analysis and personalized core routines, built around your body.</p>
    <div class="stores">
      <a class="badge" href="https://apps.apple.com/us/app/abmaxx-become-shredded/id6757769125" aria-label="Download AbMaxx on the App Store">
        <img src="appstore-badge.svg" alt="Download on the App Store" width="168" height="56">
      </a>
      <a class="badge" href="https://play.google.com/store/apps/details?id=com.rork.abmaxx" aria-label="Get AbMaxx on Google Play">
        <svg viewBox="0 0 168 56" role="img" aria-label="Get it on Google Play" xmlns="http://www.w3.org/2000/svg">
          <rect x="0.5" y="0.5" width="167" height="55" rx="8" fill="#000" stroke="#a6a6a6"/>
          <g transform="translate(13 12) scale(1.4)">
            <path fill="#00D7FE" d="M1.2 0.6 12.1 11.5 1.2 22.4c-.5-.3-.8-.8-.8-1.4V2c0-.6.3-1.1.8-1.4z"/>
            <path fill="#00F076" d="M15.7 7.9 12.1 11.5 1.2.6c.4-.2.9-.2 1.3 0z"/>
            <path fill="#FF3A44" d="M15.7 15.1 2.5 22.4c-.4.2-.9.2-1.3 0l10.9-10.9z"/>
            <path fill="#FFD500" d="M20 10.3c.8.5.8 1.8 0 2.3l-4.3 2.5-3.6-3.6 3.6-3.6z"/>
          </g>
          <text x="52" y="22" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="9" letter-spacing=".8">GET IT ON</text>
          <text x="52" y="42" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="-.2">Google Play</text>
        </svg>
      </a>
    </div>
    <p class="note">Free to download on iPhone and Android.<br>Link not opening? Open <a href="https://abmaxxapp.com">abmaxxapp.com</a> in Safari or Chrome.</p>
  </main>

  <div class="iab" id="iab" role="status">
    <div class="arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M9 6h9v9"/></svg>
    </div>
    <div>
      <b>Open in your browser to download</b>
      <div class="steps" id="iab-steps">Tap the <kbd>···</kbd> menu in the corner, then choose <kbd>Open in browser</kbd>.</div>
    </div>
    <button class="close" id="iab-close" aria-label="Dismiss">&times;</button>
  </div>

  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var inApp = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|TikTok|musical_ly|BytedanceWebview|Snapchat|Twitter|LinkedInApp|Pinterest|Line\//i.test(ua)
        || (/iPhone|iPad|iPod/.test(ua) && /AppleWebKit/.test(ua) && !/Safari|CriOS|FxiOS|EdgiOS/.test(ua))
        || location.hash === "#inapp";
      if (!inApp) return;
      var el = document.getElementById("iab");
      var steps = document.getElementById("iab-steps");
      if (/Android/i.test(ua)) {
        steps.innerHTML = 'Tap the <kbd>⋮</kbd> menu in the top corner, then choose <kbd>Open in Chrome</kbd> or <kbd>Open in browser</kbd>.';
      } else {
        steps.innerHTML = 'Tap the <kbd>···</kbd> menu in the corner, then choose <kbd>Open in Safari</kbd> or <kbd>Open in browser</kbd>.';
      }
      el.classList.add("show");
      document.getElementById("iab-close").addEventListener("click", function () { el.classList.remove("show"); });
    })();
  </script>
</body>
</html>
