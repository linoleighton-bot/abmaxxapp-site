  html, body { height: 100%; background: var(--bg); }
  body {

  .store svg { width: 30px; height: 30px; flex-shrink: 0; }
  .store small { display: block; font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; opacity: .65; line-height: 1.2; }
  .store strong { display: block; font-size: 21px; font-weight: 700; line-height: 1.15; }
